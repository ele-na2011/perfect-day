<!DOCTYPE html>
<html lang="en">
    <head>
        <title>daydream village</title>
        <link rel = "stylesheet" href = "styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body class = "gamescreen">
        <h1 class = "titletext">daydream village</h1>
        <p>build a day together</p>

        <button class = "gameguidebutton">game guide</button>

        <div class = "gameguide">
            <h3>game guide</h3>
            <ul>
                <li>complete 2 actions to collect coins</li>
                <li>coins are multiplied by impact</li>
                <li>use coins to buy loot boxes (under development)</li>
                <li>maintain village happiness</li>
            </ul>
        </div>

        <div class = "status" id = "status">
            <div id = "timeElement">

            </div>
            <div id = "happinessBar">
                <h3>village happiness</h3>
            </div>
            <div id = "coinBalance">
                <h3>coin balance</h3>
            </div>
        </div>

        <div class = "backpack" id = "backpack">
            <h3>backpack</h3>
        </div>


    </body>
</html>
