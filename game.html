<!DOCTYPE html>
<html lang="en">
<head>
    <title>daydream village</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="world">
    <div class="titlebar">
        <h1>daydream<br>village</h1>
        <button id="guide-btn" class="pill-btn">i!</button>
    </div>

    <aside class="stats">
        <div class="stat time-stat">
            <span class="stat-label">time</span>
            <span class="stat-value" id="clock">08:00</span>
        </div>
        <div class="stat">
            <span class="stat-label">coins</span>
            <span class="stat-value" id="coins">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">town<br>happiness</span>
            <span class="stat-value" id="happy-value">92%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </aside>

    <div id="grid" class="field"></div>

    <section id="guide" class="panel open">
        <h2><span class="badge">i!</span> Game Guide</h2>
        <div class="panel-body">
            <p>situated in a cozy little town! feat. alexis lee and rachel li</p>
            <p>i love frogs and arctic foxes…</p>
        </div>
    </section>

    <section class="backpack" id="backpack">
        <div class="grabber"></div>
        <div class="backpack-head">
            <h2>backpack</h2>
            <div class="actions-pill">
                <span id="actions">2 actions left today</span>
                <span class="dots">⋮⋮</span>
            </div>
        </div>
        <div class="slots" id="slots">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </section>
</div>
</body>
</html>
